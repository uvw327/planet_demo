/**
 * apply: 'full' 重跑因果链 | 'river' 只重判河流 | 'relief' 只重算几何+光照 | 'color' 只重算顶点色
 */
function addSlider(label, min, max, stepv, get, set, apply, fmt) {
  const d = document.createElement('div'); d.className = 'ctl';
  const f = fmt || ((v) => (stepv < 0.01 ? v.toFixed(3) : v.toFixed(2)));
  d.innerHTML = '<label><span>' + label + '</span><b>' + f(get()) + '</b></label>';
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = stepv; inp.value = get();
  const lab = d.querySelector('b');
  const commit = () => {
    if (apply === 'full') regenerate();
    else quickUpdate(apply);
  };
  const onInput = apply === 'full' ? debounce(commit, 220) : debounce(commit, apply === 'color' ? 0 : 90);
  inp.oninput = () => { set(parseFloat(inp.value)); lab.textContent = f(parseFloat(inp.value)); onInput(); };
  d.appendChild(inp); $('ctls').appendChild(d);
}

function buildPanel() {
  const C = CONFIG;
  addNumber('seed', () => C.seed, (v) => { C.seed = v; });
  addSlider('seaLevel', 0.15, 0.60, 0.005, () => C.seaLevel, (v) => { C.seaLevel = v; }, 'full');
  addSlider('mountainSharpness', 6, 14, 0.1, () => C.terrain.mountainSharpness, (v) => { C.terrain.mountainSharpness = v; }, 'full');
  addSlider('raininess', 0, 2, 0.05, () => C.climate.raininess, (v) => { C.climate.raininess = v; }, 'full');
  addSlider('riverThreshold', 0.2, 6, 0.1, () => C.hydro.riverThreshold, (v) => { C.hydro.riverThreshold = v; }, 'river');
  addSlider('reliefScale（>0 会遮墨线）', 0, 0.06, 0.002, () => C.render.reliefScale, (v) => { C.render.reliefScale = v; }, 'relief');
  addSlider('subtropicalStrength', 0, 0.8, 0.02, () => C.climate.subtropicalStrength, (v) => { C.climate.subtropicalStrength = v; }, 'full');
  addSlider('saturationFloor（冷海湿度）', 0, 0.6, 0.01, () => C.climate.saturationFloor, (v) => { C.climate.saturationFloor = v; }, 'full');
  addSlider('rainShadow', 0, 1, 0.02, () => C.climate.rainShadow, (v) => { C.climate.rainShadow = v; }, 'full');
  addSlider('lapseRate', 0, 1.2, 0.02, () => C.terrain.lapseRate, (v) => { C.terrain.lapseRate = v; }, 'full');
  addSelect('windMode', [['zonal', '纬向风带（三圈环流）'], ['uniform', '单向风（调试）']],
    () => C.climate.windMode, (v) => { C.climate.windMode = v; });
  addSelect('rainSolver', [['gaussSeidel', 'Gauss-Seidel（默认）'], ['jacobi', 'Jacobi（调试）']],
    () => C.climate.rainSolver, (v) => { C.climate.rainSolver = v; });
  // M2 手绘：这三项只影响逐顶点上色，不重跑因果链（'color' 档 = 即时）
  addSlider('paperMix', 0, 0.25, 0.005, () => C.render.paperMix, (v) => { C.render.paperMix = v; }, 'color');
  addSlider('paperNoise', 0, 0.20, 0.005, () => C.render.paperNoise, (v) => { C.render.paperNoise = v; }, 'color');
  addSlider('riverWidth', 0.4, 2.5, 0.05, () => C.render.riverMaxWidth / 0.015,
    (v) => { C.render.riverMaxWidth = 0.015 * v; C.render.riverMinWidth = 0.0018 * v; }, 'river');
  // ★ 河网密度：拓扑门槛（上游汇水面积，格）与水量门槛（流量）
  addSlider('riverArea（汇水面积门槛）', 1, 30, 1, () => C.render.riverAreaThreshold,
    (v) => { C.render.riverAreaThreshold = v; }, 'river');
  addSlider('riverFlowMin（干河床门槛）', 0, 1.5, 0.05, () => C.render.riverFlowMin,
    (v) => { C.render.riverFlowMin = v; }, 'river');
}

/* ── 场景 ── */
function buildScene() {
  const canvas = $('scene');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  // 调色板是「显示取值」，直接原样输出，不做 sRGB 转换
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f14);

  camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(1.9, 1.25, 2.3);

  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.rotateSpeed = 0.55;
  controls.minDistance = 1.35;
  controls.maxDistance = 9;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;

  planetMesh = new THREE.Mesh(new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.FrontSide }));
  planetMesh.frustumCulled = false;
  scene.add(planetMesh);

  // 墨线层：海岸线 + 湖岸线合并（顶点色区分）——1 个 draw call，有真实宽度
  // ★ forceSinglePass：墨线是贴在球面上的薄片、双面 + 透明，three.js 默认会为了
  //   正确的混合顺序把「双面透明」材质渲染两趟（Front/Back 各一遍）→ 白白翻倍 draw call。
  //   墨线不需要背面单独混合，强制单趟即可（draw call 5 → 3）。
  inkObj = new THREE.Mesh(new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: CONFIG.render.coastOpacity,
      side: THREE.DoubleSide, depthWrite: false, forceSinglePass: true,
    }));
  inkObj.frustumCulled = false;
  scene.add(inkObj);

  // 河流缎带：变宽度三角带（上游细、下游粗），1 个 draw call
  riverObj = new THREE.Mesh(new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true, opacity: CONFIG.render.riverOpacity,
      side: THREE.DoubleSide, depthWrite: false, forceSinglePass: true,
    }));
  riverObj.frustumCulled = false;
  scene.add(riverObj);

  raycaster = new THREE.Raycaster();
  canvas.addEventListener('pointermove', (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    pickDirty = true;
  });
  canvas.addEventListener('pointerleave', () => {
    pointer.set(-2, -2); hoverRegion = -1; renderTileInfo();
  });
  canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; });
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') controls.autoRotate = !controls.autoRotate; });
  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
}

function doPick() {
  if (!pickDirty || !S) return;
  pickDirty = false;
  if (pointer.x < -1.5) return;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(planetMesh, false);
  let r = -1;
  if (hits.length > 0 && hits[0].faceIndex !== undefined) {
    r = S.triToRegion[hits[0].faceIndex];
  }
  if (r !== hoverRegion) { hoverRegion = r; renderTileInfo(); }
}

/* ── 主循环 ── */
let lastT = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = now - lastT; lastT = now;
  if (dt > 0 && dt < 400) TIMING._maxFrame = Math.max(TIMING._maxFrame || 0, dt);
  controls.update();
  doPick();
  renderer.render(scene, camera);
}

/* ── 启动 ── */
async function main() {
  try {
    showOverlay('初始化…', '构建 icosphere 与对偶结构（L1）');
    buildScene();
    buildViewButtons();
    buildPanel();
    await nextFrame();
    const t1 = initAlgorithm();
    console.log('[M1] L1 网格 + 对偶 + 邻接：' + t1.toFixed(1) + ' ms，region=' + T.n + '，三角=' + T.nT
      + '，渲染顶点=' + (T.n + T.nT) + '，draw call = 1');
    document.documentElement.dataset.level = String(CONFIG.level);
    await regenerate();
    setView(CONFIG.view);
    requestAnimationFrame(animate);
  } catch (err) {
    console.error(err);
    $('err').classList.add('on');
    $('err-detail').textContent = String(err && err.message || err);
    hideOverlay();
  }
}

main();

/* 供 headless 测试脚本与 Godot 侧对照使用的导出（浏览器里无副作用） */
globalThis.__PLANET__ = {

  applyMountainRidge, assignTemperature, assignWind, solveRainfall, normalizeMoisture,
  priorityFlood, detectLakes, accumulateFlow, classifyBiome, classifyAllBiomes,
  paletteAt, waterColorAt, whittakerAt, bakeVertexShading, buildRenderMesh,
  refreshVertexColors, buildCoastLine, buildLakeShoreSegments, appendRibbon,
  buildInkGeometry, buildRiverRibbon, hexToRgb01,
  get state() { return { T, S, RAIN, LAKE, HYD, TIMING, INK, RIB }; },

  get renderer() { return renderer; },

  get controls() { return controls; },
  /** 调试用：改完 CONFIG 后强制重建几何（验证脚本用） */
  rebuild: () => rebuildGeometry(),
  /** 调试用：改完 CONFIG 后重跑整条因果链（验证脚本用） */
  regen: () => regenerate(),
};

</script>
