<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Goldberg 球体 · 程序化生物群系星球</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05070d;
  }

  canvas { display: block; }

  /* ---------- 左上角信息面板 ---------- */
  #hud {
    position: fixed; top: 16px; left: 16px;
    min-width: 232px;
    padding: 12px 15px;
    background: rgba(9, 15, 27, 0.74);
    border: 1px solid rgba(110, 165, 225, 0.22);
    border-radius: 10px;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    color: #cfe2f5;
    font: 13px/1.75 ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .16s ease, transform .16s ease;
  }
  #hud.visible { opacity: 1; transform: translateY(0); }

  #hud .row { display: flex; justify-content: space-between; gap: 18px; }
  #hud .k { color: #6b87a6; }
  #hud .v { color: #ecf5ff; font-weight: 600; }

  /* ---------- 右上角图例 ---------- */
  #legend {
    position: fixed; top: 16px; right: 16px;
    padding: 11px 14px;
    background: rgba(9, 15, 27, 0.62);
    border: 1px solid rgba(110, 165, 225, 0.16);
    border-radius: 10px;
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    font: 12px/1.9 ui-monospace, Consolas, monospace;
    color: #9db4cc;
    pointer-events: none;
  }
  #legend .item { display: flex; align-items: center; gap: 8px; }
  #legend .swatch {
    width: 11px; height: 11px; border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
  }
  /* 分组标题：把「气候群系」与「覆盖层」在视觉上分开 */
  #legend .group {
    margin: 8px 0 1px;
    color: #6b87a6;
    font-size: 11px;
    letter-spacing: .06em;
  }
  #legend .group:first-child { margin-top: 0; }

  /* ---------- 左下角操作提示 ---------- */
  #hint {
    position: fixed; left: 18px; bottom: 14px;
    font: 12px ui-monospace, Consolas, monospace;
    color: #47596e;
    /* 必须让点击穿透，否则左下角这一条会挡住画布，导致那一带点不中图块 */
    pointer-events: none;

  /* ---------- 加载 / 报错 ---------- */
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #6d8aa8;
    font: 14px ui-monospace, Consolas, monospace;
    text-align: center;
    line-height: 1.9;
    padding: 24px;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="row"><span class="k">生物群系</span><span class="v" id="hud-biome">-</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

/* =========================================================================
 * §0  全局配置
 * 所有可调参数集中在此，改这里即可换一颗截然不同的星球。
 * ========================================================================= */
const CONFIG = {
  /* --- 星球本体 --- */
  seed: 20261016,      // 噪声种子：换一个数字就是另一颗星球（结果可复现）

  // level 决定球面精细度，图块数 = 10·4^level + 2。实测（纯算法耗时，不含 WebGL 上传）：
  //   level 3 →   642 图块 /  3840 三角形 /  生成 ~6 ms
  //   level 4 →  2562 图块 / 15360 三角形 /  生成 ~16 ms
  //   level 5 → 10242 图块 / 61440 三角形 /  生成 ~65 ms   ← 现选值
  // 渲染架构（渲染重构后）：所有图块合并成 1 个 BufferGeometry + 顶点色（见 §7），
  //   draw call 与图块数**无关**（星球恒 1 次；星空 / 描边 / 矿石各自 +1），
  //   所以 level 只受「生成耗时」约束 —— 这正是敢上 level 5 的前提。
  level: 5,

  /* --- 生物群系判定阈值 --- */
  seaLevel: 0.35,        // 海平面：elevation 低于此值为海洋
  seaIceLatitude: 0.93,  // |latitude| 超过此值的海面 → 海冰

  /* --- 气候模型 --- */
  // 温度由「太阳辐射（cos 纬度）+ 海拔递减」决定，湿度由「三圈环流」纬度带决定，
  // 两者共同划分气候带，避免出现「冰原旁边长着热带雨林」这类不合理现象。
  lapseRate: 0.50,        // 海拔递减率：陆地相对高度每 +1，温度下降多少
  climateScale: 1.50,     // 气候扰动噪声频率
  tempNoise: 0.05,        // 温度扰动幅度（让等温线不是完美的圆）
  // ★ 湿度扰动改为「乘性」（阶段 A）：
  //   旧版是加性 `moisture += jitter * 0.30`，在基础湿度接近 0 的干旱区会把值推成负数，
  //   再被 clamp01 截成 0 —— 于是形成「一整片精确等于 0 的绝对沙漠环」。
  //   乘性扰动的绝对幅度随基础湿度缩放（湿处波动大、干处波动小），且只要基础值 > 0 就永不为负。
  moistureNoise: 0.90,    // 湿度乘性扰动强度（指数形式：moisture ×= exp(jitter · 该值)）
  // ★ 副热带下沉脱湿强度（乘性）：副热带基础湿度保留 (1 − 该值)。
  //   旧版是减性扣减 `- drySubtropic * 0.85`，在副热带中心把 0.253 减成 −0.597 → 截成 0。
  subtropicDrying: 0.45,

  // 温度带阈值（0 = 极寒，1 = 酷热）
  tempIce: 0.22,          // 低于此值 → 冰原（约 |lat| > 0.975，即纬度 77° 以上）
  tempTundra: 0.42,       // 低于此值 → 苔原（约纬度 65° 以上）
  tempTaiga: 0.62,        // 低于此值 → 针叶林（约纬度 52° 以上）
  tempTropical: 0.85,     // 高于此值 → 热带（约纬度 32° 以内）

  // 湿度阈值（0 = 极干，1 = 极湿）
  // ★ 阶段 A 重新标定：旧的 0.30 / 0.48 是按「旧湿度场」定的，而旧湿度场在副热带
  //   是从 0.005 直接跳到 0.375（10% 纬度内），阈值落在那段悬崖上，导致沙漠与森林直接相邻、
  //   草原只剩 1.39%。换成乘性湿度场后分布平滑了，阈值必须跟着重新落位。
  //   新的两个阈值是按「参与湿度分类的陆地」的湿度分位定的（阶段 A 当时的基线是 2288 格、
  //   约占陆地 35.6%；**地形地基后分母变了，H1 后这一比例是 60.73%**，阈值本身未动）：
  //     沙漠   = 分位 ≤ p27   ≈ 0.25  → 约占陆地 10%
  //     草原   = 分位 p27~p63 ≈ 0.65  → 约占陆地 13%
  //     森林+雨林 = 分位 > p63        → 约占陆地 13%
  //   这样「沙漠 → 半干旱草原 → 森林」三段各占约三分之一，且彼此都有连续过渡。
  //   （H1 验收实测：草原 22.05%、沙漠 17.66%、雨林 9.92% —— 阈值没动，占比变化来自
  //     "河流不再是群系"与"海拔场换过"，见 docs/v1-biome-globe-review.md §8）
  moistureDesert: 0.25,   // 低于此值 → 沙漠
  moistureGrassland: 0.65,// 低于此值 → 草原，以上 → 森林

  /* --- 地形高度（FBM）--- */
  // ★ 地基改造：把「一块 96.83% 的超大陆」拆成「一个主大陆 + 若干次级大陆」。
  //   实测（landFraction 0.38 下扫 cs × cOct × dOct，见 docs/terrain-shots/）：
  //     cs=0.80 cOct=4 dOct=6 → 最大陆块 38.8% 陆地 · 39 块 · 单格孤岛 12  ← 旧值，M3 不达标
  //     cs=1.20 cOct=2 dOct=2 → 最大陆块 48.1% 陆地 · 26 块 · 单格孤岛  2  ← 现选值
  //   两条经验：
  //     ① 降陆地占比本身就会把超大陆拆开（陆地从多数相变成少数相），所以 cs 只调 0.8→1.2；
  //     ② detailOctaves 原来给到 6，最细八度频率 = detailScale·2^5 = 96，特征尺度 0.6°，
  //        **细过图块本身**（level 5 图块间距约 2.0°）—— 等于给每个格子加纯随机噪声，
  //        既是单格孤岛的主因，也是"海岸线碎成渣"的主因。降到 2 后最细特征约 9.5°（≈5 格）。
  continentScale: 1.20,   // 大陆噪声频率：越小 → 大陆越成片（0.80 会给出单块超大陆）
  continentOctaves: 2,    // 大陆噪声八度：只留大尺度，海岸线的碎度交给 detailScale
  continentWeight: 0.65,  // 大陆噪声权重（其余为细节噪声）
  detailScale: 3.00,      // 细节噪声频率：越大 → 地形越碎
  detailOctaves: 2,       // 细节噪声八度：别让最细八度细过网格（见上）

  /* --- 海陆比与高度分布 --- */
  // ★ 地基改造（阶段 D 的前置）：陆地占比从「靠 elevationCenter 猜」改为「分位精确命中」。
  //   旧写法 elevation = elevationCenter + z·spread，海平面 0.35 只在这个分布上随手切一刀，
  //   于是陆地占比是三个参数的**副作用**，实测 62.87%（半个星球都是陆地），想改只能试错。
  //   新写法把 z 的「第 (1 − landFraction) 分位」直接对齐到海平面，Land 的格子数就
  //   **精确等于** landFraction × 图块数。为什么非要精确：陆地占比是所有群系占比的分母
  //   （"雪峰 ≤ 12%" 是"占陆地"），分母飘一点，下游所有目标数字都要重新推导。
  landFraction: 0.38,     // 目标陆地占比：0.38 约为地球的 1.3 倍，且能自然裂成数块大陆
  elevationSpread: 0.30,  // 海拔自海平面向上的展开幅度：越大 → 陆地越"高"、高山雪峰越多

  /* --- 河流（水文）--- */
  // ★ H1：河流已从「群系」改为「覆盖层」，旧的三个参数（riverScale / riverWidth /
  //   riverMaxElevation）一并删除。旧实现是「另一路噪声的零值线」，判定出来的是
  //   "填满整格"的蓝色图块，不是有流向的树枝状水系。
  //   新的水文参数统一放进 CONFIG.hydro，在 H2 落地；见 docs/river-system-design.md §3、§7。

  /* --- 立体感 --- */
  // 本星球是「选择出生地」的俯视界面，不是可供 3D 角色行走的地形。
  // 山脉与平原的视觉差别由贴图/颜色表达（类似 RimWorld 的平面地图），
  // 因此刻意保持一个完全光滑的球面，不做任何高度起伏。
  // 若将来确实需要高低起伏，把下面这行改为 true 即可恢复「共享顶点半径」的隆起方案（无缝隙）。
  enableHeightOffset: false,
  heightScale: 0.10,         // 隆起幅度，仅在 enableHeightOffset 为 true 时生效

  /* --- 渲染（移动端优先）--- */
  // 合并几何体后整颗星球只占 1 个 draw call，此时每一分渲染开销都会直接变成
  // 手机的电量与帧率，所以下面几项一律"够用就好"。
  maxPixelRatio: 2,          // 设备像素比上限：手机 DPR 常为 3，限到 2 省约 55% 填充率
  antialias: true,           // MSAA。关掉能再省一点填充率，但六边形边缘会明显锯齿
  hoverTint: 0.38,           // 悬停高亮强度（0 = 本色，1 = 纯白）；与重构前的观感一致
  selectionTint: 0.55,       // 选中高亮强度
  selectionColor: 0x8fe3ff,  // 选中色：偏青，与 12 种群系色都不撞

  /* --- 其他 --- */
  enableRotation: false,     // 行星自转
  rotationSpeed: 0.05,       // 自转速度（弧度/秒）
  debugAssert: true,         // 是否在控制台输出自测结果
};

/* =========================================================================
 * §1  常量表与工具函数
 * ========================================================================= */

/**
 * 气候群系枚举（★ H1：河流已从这里移出）。
 *
 * 「河」不是气候决定的原生地表覆盖，而是**水文覆盖层**，与「山脉 / 雪线 / 湖泊」
 * 同类：赤道有雪峰、沙漠里有湖、雨林里有山 —— 它和气候正交。
 * 所以它不该占群系名额，也不该参与 classifyBiome 的判定优先级。
 * 详见 docs/river-system-design.md §3「分层地表模型」。
 * 空出的名额留给真正的群系（稀树草原 / 湿地 / 盐湖），服务 M19（≥15 种）。
 */
const BIOME = {
  OCEAN:      'ocean',       // 海洋
  SEA_ICE:    'seaIce',      // 极地海冰
  DESERT:     'desert',      // 沙漠（炎热 + 干旱）
  GRASSLAND:  'grassland',   // 草原（半干旱）
  FOREST:     'forest',      // 温带森林
  RAINFOREST: 'rainforest',  // 热带雨林（炎热 + 湿润）
  TAIGA:      'taiga',       // 针叶林（寒温带）
  TUNDRA:     'tundra',      // 苔原（亚寒带）
  MOUNTAIN:   'mountain',    // 山脉
  SNOW:       'snow',        // 雪峰
  ICE:        'ice',         // 极地冰原
};

/** 生物群系 → 纯色（后续可替换为手绘贴图） */
const BIOME_COLOR = {
  [BIOME.OCEAN]:      0x1a3a6b,
  [BIOME.SEA_ICE]:    0xcfe2ee,
  [BIOME.DESERT]:     0xe0c56e,
  [BIOME.GRASSLAND]:  0x9ab54f,
  [BIOME.FOREST]:     0x3d8c40,
  [BIOME.RAINFOREST]: 0x1f6b2e,
  [BIOME.TAIGA]:      0x2f6b4f,
  [BIOME.TUNDRA]:     0x8b9683,
  [BIOME.MOUNTAIN]:   0x7a7a7a,
  [BIOME.SNOW]:       0xf0f0f0,
  [BIOME.ICE]:        0xdce8f2,
};

/** 生物群系 → HUD 中文名 */
const BIOME_LABEL = {
  [BIOME.OCEAN]:      '海洋',
  [BIOME.SEA_ICE]:    '海冰',
  [BIOME.DESERT]:     '沙漠',
  [BIOME.GRASSLAND]:  '草原',
  [BIOME.FOREST]:     '温带森林',
  [BIOME.RAINFOREST]: '热带雨林',
  [BIOME.TAIGA]:      '针叶林',
  [BIOME.TUNDRA]:     '苔原',
  [BIOME.MOUNTAIN]:   '山脉',
  [BIOME.SNOW]:       '雪峰',
  [BIOME.ICE]:        '冰原',
};

/** 高度阶梯阈值（高山与低地气候无关，单独处理） */
const SNOW_LEVEL     = 0.80;
const MOUNTAIN_LEVEL = 0.65;

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const clamp   = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

/**
 * mulberry32：32 位种子伪随机数生成器，返回 [0,1) 的浮点数。
 * 用它替代 Math.random，使地形完全可复现。
 */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =========================================================================
 * §2  噪声
 * 注意：three 的 SimplexNoise 构造函数调用的是 r.random()，
 *      因此必须传入「带 random() 方法的对象」，不能直接传函数。
 * ========================================================================= */
const rng = mulberry32(CONFIG.seed);
const noise = new SimplexNoise({ random: rng });

// 五路互不相关的固定偏移，避免不同频率的噪声在原点附近产生关联
const OFFSET_A = new THREE.Vector3(rng() * 400, rng() * 400, rng() * 400);  // 大陆
const OFFSET_B = new THREE.Vector3(rng() * 400, rng() * 400, rng() * 400);  // 细节
// ⚠ 这五路偏移共用同一条 rng 序列，**删掉任何一路都会挪动后面几路的取值**。
//   OFFSET_C 原本是「河流噪声」的偏移，H1 起河流已不再用它，但这一行必须留着占位：
//   删掉会少消耗 3 次 rng() → OFFSET_D/E（温度、湿度扰动）改变 → 气候与群系全变，
//   H1 就做不到"除河流外逐像素不变"。
const OFFSET_C = new THREE.Vector3(rng() * 400, rng() * 400, rng() * 400);  // 已停用（占位）
const OFFSET_D = new THREE.Vector3(rng() * 400, rng() * 400, rng() * 400);  // 温度扰动
const OFFSET_E = new THREE.Vector3(rng() * 400, rng() * 400, rng() * 400);  // 湿度扰动

/** 统一的 3D 噪声采样入口（返回约 [-1, 1]，便于将来替换噪声实现） */
function sampleNoise3D(x, y, z) {
  return noise.noise3d(x, y, z);
}

/**
 * 分形布朗运动（FBM）：多个八度的噪声叠加，得到更自然的地形。
 * @returns 归一化到约 [-1, 1] 的值
 */
function fbm3(p, octaves, lacunarity, gain, offset) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * sampleNoise3D(
      p.x * freq + offset.x,
      p.y * freq + offset.y,
      p.z * freq + offset.z,
    );
    norm += amp;
    amp  *= gain;
    freq *= lacunarity;
  }
  return sum / norm;
}

/* =========================================================================
 * §3  球体网格生成（二十面体 → 细分 → 对偶图）
 * ========================================================================= */

/**
 * 构造正二十面体。
 * 顶点来自标准公式 (±1, ±φ, 0) 的轮换，其模长约为 1.902，
 * 因此必须逐个 normalize()，否则 center.y 不再等于 sin(纬度)。
 */
function buildIcosahedron() {
  const t = (1 + Math.sqrt(5)) / 2;
  const raw = [
    [-1,  t,  0], [ 1,  t,  0], [-1, -t,  0], [ 1, -t,  0],
    [ 0, -1,  t], [ 0,  1,  t], [ 0, -1, -t], [ 0,  1, -t],
    [ t,  0, -1], [ t,  0,  1], [-t,  0, -1], [-t,  0,  1],
  ];
  const vertices = raw.map((v) => new THREE.Vector3(v[0], v[1], v[2]).normalize());

  const faces = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
  ];
  return { vertices, faces };
}

/**
 * 递归细分：每个三角形一分为四，中点归一化投影到单位球面。
 * 必须用 Map 缓存边中点，保证共享边两侧引用的是同一个顶点索引。
 */
function subdivide(vertices, faces, level) {
  for (let iter = 0; iter < level; iter++) {
    const cache = new Map();  // 边 → 中点顶点索引

    const getMidpoint = (i, j) => {
      // 数值键：min*1e6 + max。顶点总数远小于 1e6（level=4 时 V=2562），键唯一
      const key = Math.min(i, j) * 1e6 + Math.max(i, j);
      let idx = cache.get(key);
      if (idx !== undefined) return idx;

      const v = vertices[i].clone().add(vertices[j]).normalize();
      idx = vertices.push(v) - 1;
      cache.set(key, idx);
      return idx;
    };

    const next = [];
    for (const [a, b, c] of faces) {
      const ab = getMidpoint(a, b);
      const bc = getMidpoint(b, c);
      const ca = getMidpoint(c, a);
      next.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
    }
    faces = next;
  }
  return { vertices, faces };
}

/**
 * 求对偶图，得到 Goldberg 多面体。
 *
 * 返回值契约：
 *   dualPos  : Vector3[]  长度 = faces.length，每个元素是某三角形的归一化重心
 *   polygons : [{ center, vertexIndices }]
 *     - center        : 对应的原网格顶点（单位向量），即对偶面的中心
 *     - vertexIndices : 环形排序后指向 dualPos 的下标，长度为 5 或 6
 *
 * 不变式：polygons.length === vertices.length，且 polygons[i] 对应 vertices[i]；
 *         其中恰好 12 个多边形的 vertexIndices.length === 5（五边形）。
 *
 * 关键：这里只保存【索引】而不拷贝坐标，渲染坐标统一由 §5 的 renderPos 给出，
 *      这是「顶点偏移不产生缝隙」的前提。
 */
function buildDual(vertices, faces) {
  // 1) 对偶顶点 = 每个三角形的归一化重心，索引与 faces 一一对应
  const dualPos = faces.map(([a, b, c]) => new THREE.Vector3()
    .add(vertices[a])
    .add(vertices[b])
    .add(vertices[c])
    .divideScalar(3)
    .normalize());

  // 2) 原网格顶点 → 相邻三角形索引
  const vertexFaces = Array.from({ length: vertices.length }, () => []);
  faces.forEach((f, fi) => {
    for (const vi of f) vertexFaces[vi].push(fi);
  });

  // 3) 每个原顶点生成一个对偶面（多边形）
  const HELPER_X = new THREE.Vector3(1, 0, 0);
  const HELPER_Y = new THREE.Vector3(0, 1, 0);
  const U = new THREE.Vector3();
  const W = new THREE.Vector3();
  const D = new THREE.Vector3();

  const polygons = [];
  for (let vi = 0; vi < vertices.length; vi++) {
    const n = vertices[vi];

    // 构造切平面正交基。该构造恒满足 u × w = n，因此环序从球外看始终为逆时针。
    const helper = Math.abs(n.x) < 0.9 ? HELPER_X : HELPER_Y;
    U.crossVectors(helper, n).normalize();
    W.crossVectors(n, U);

    // 把相邻三角形重心投影到切平面，按极角排序得到环绕顺序
    const ring = vertexFaces[vi].map((fi) => {
      const p = dualPos[fi];
      D.copy(p).addScaledVector(n, -p.dot(n));   // 去掉法线分量 → 切平面投影
      return { fi, ang: Math.atan2(D.dot(W), D.dot(U)) };
    });
    ring.sort((x, y) => x.ang - y.ang);

    polygons.push({
      center: n.clone(),
      vertexIndices: ring.map((x) => x.fi),
    });
  }

  return { dualPos, polygons };
}

/* =========================================================================
 * §4  地形生成
 * ========================================================================= */

/**
 * 陆地隆起量：海面保持半径 1，陆地按海拔线性抬升。
 *
 * 注意：默认配置下 `enableHeightOffset` 为 false，本函数恒返回 0，
 * 因此整个球面是半径严格为 1 的光滑球体（无任何高低起伏）。
 * 保留这段实现，是为了将来若需要立体感可以直接开启。
 */
function displacement(elevation) {
  if (!CONFIG.enableHeightOffset) return 0;
  if (elevation <= CONFIG.seaLevel) return 0;         // 海洋压平
  const t = (elevation - CONFIG.seaLevel) / (1 - CONFIG.seaLevel);
  return t * CONFIG.heightScale;
}

/**
 * 计算所有图块的海拔。
 *
 * 分三步：
 *   1. 用「大陆噪声 + 细节噪声」混合出原始高度（连续、自然）；
 *   2. 对全体样本做 z-score 标准化，得到无量纲的 z；
 *   3. 「分位锚定」：把 z 的第 (1 − landFraction) 分位对齐到海平面，再按 elevationSpread 向上展开。
 *
 * 第 3 步是地基改造的关键。旧写法是 `elevation = elevationCenter + z · spread`，
 * 海平面 0.35 只是在这个分布上随手切一刀 —— 陆地占比
 * `P(elevation > seaLevel)` 是 elevationCenter / elevationSpread / seaLevel 三个参数的
 * **副作用**，想要多少陆地只能靠试错（实测 62.87%，即"半个星球都是陆地"）。
 *
 * 分位锚定让陆地占比变成一个**精确命中**的输入：先把 z 排序取出分位点 zAtSea，再令
 *     elevation = seaLevel + (z − zAtSea) · spread
 * 于是 `elevation > seaLevel ⇔ z > zAtSea ⇔ 恰好 landFraction 比例的图块`（分位数取整误差 ≤ 1 格）。
 * 好处有二：① 海陆比可以直接写在 CONFIG 里；② spread 与海陆比彻底解耦 ——
 * spread 只负责"陆地有多高"，不再偷偷改变海陆比。
 *
 * clamp01 只在最顶端收口（约 0.6% 的极高点落到 1.0），它们远高于海平面，
 * 因此既不影响海陆比，也不影响分位锚定的精确性。
 */
function computeElevations(tiles) {
  const n = tiles.length;
  const z = new Float64Array(n);

  // 1. 原始高度：低频「大陆」噪声（决定大陆形状）+ 高频「细节」噪声（决定海岸线细节）
  let sum = 0, sum2 = 0;
  for (let i = 0; i < n; i++) {
    const c = tiles[i].center;
    const pC = c.clone().multiplyScalar(CONFIG.continentScale);
    const pD = c.clone().multiplyScalar(CONFIG.detailScale);

    const continent01 = fbm3(pC, CONFIG.continentOctaves, 2.0, 0.5, OFFSET_A) * 0.5 + 0.5;
    const detail01    = fbm3(pD, CONFIG.detailOctaves,    2.0, 0.5, OFFSET_B) * 0.5 + 0.5;

    const raw = CONFIG.continentWeight * continent01 + (1 - CONFIG.continentWeight) * detail01;
    z[i] = raw;
    sum += raw; sum2 += raw * raw;
  }

  // 2. z-score 标准化
  const mean = sum / n;
  const std = Math.sqrt(Math.max(1e-12, sum2 / n - mean * mean));
  for (let i = 0; i < n; i++) z[i] = (z[i] - mean) / std;

  // 3. 分位锚定（TypedArray 的 sort 默认就是数值升序，无需比较函数）
  const sorted = z.slice().sort();
  const k = clamp(Math.floor((1 - CONFIG.landFraction) * n), 0, n - 1);
  const zAtSea = sorted[k];

  for (let i = 0; i < n; i++) {
    tiles[i].elevation = clamp01(CONFIG.seaLevel + (z[i] - zAtSea) * CONFIG.elevationSpread);
  }
}

/*
 * ★ H1：这里原本是 isRiver()（另一路噪声的「零值线」→ 判出来的是"填满整格"的蓝块）。
 *   河流已改为「覆盖层」，判定交给 H2 的 computeHydrology()：
 *   填平洼地 → 多流向(MFD)分配 → 汇水累积 → 阈值提取 → 湖/内流盆地。
 *   见 docs/river-system-design.md §4。
 */

/**
 * 纬向基础湿度 —— 三圈环流模型（★ 阶段 A 改为「乘性脱湿」）。
 *
 * 大气环流决定了降水在地球上的带状分布，这条规律与温度无关：
 *   赤道（|lat| ≈ 0.00）  上升气流 → 湿润   （热带雨林带）
 *   副热带（≈ 0.40）      下沉气流 → 干旱   （撒哈拉、阿拉伯、澳洲沙漠带）
 *   中纬（≈ 0.72）        西风带   → 湿润   （温带森林带）
 *   极地（≈ 1.00）        下沉气流 → 干旱
 *
 * 参数 absLat 为 |sin(地理纬度)|，返回基础湿度（调用方需 clamp）。
 *
 * ★ 为什么把「减性扣减」改成「乘性脱湿」：
 *   旧实现 `max(wetEquator, wetMidLat) * 1.15 − drySubtropic * 0.85`，
 *   在副热带中心（|lat| = 0.40）给出 0.253 − 0.850 = −0.597，被 clamp01 压成 0。
 *   实测后果：副热带陆地 76.8% 的格子湿度**精确等于 0**（纬度 30–40% 档达 99.4%，
 *   标准差仅 0.004）—— 沙漠带内没有任何梯度，也没有绿洲/半干旱的过渡，
 *   全星球的「草原」因此只剩 1.39%。
 *   物理上，「下沉气流」是把水汽**按比例**压干，而不是从湿度里减掉一个常数；
 *   乘性形式保证任何位置都保留残余湿度，带与带之间连续过渡，
 *   于是「沙漠 → 半干旱草原 → 稀树草原 → 雨林」的过渡带才有可能出现。
 */
function latitudinalMoisture(absLat) {
  const wetEquator   = Math.exp(-Math.pow(absLat / 0.30, 2));
  const wetMidLat    = Math.exp(-Math.pow((absLat - 0.72) / 0.26, 2));
  // 干旱带的中心与宽度需要贴近真实：约 15°~35°（|lat| 0.26~0.57），
  // 太宽会把中纬度的温带森林和草原一起吃掉。
  const drySubtropic = Math.exp(-Math.pow((absLat - 0.40) / 0.16, 2));
  // 湿带包络：赤道与中纬各一个峰，取较大者
  const wet = Math.max(wetEquator, wetMidLat);
  // 副热带下沉：乘性脱湿（保底 (1 − subtropicDrying)，永不归零）
  return wet * (1 - drySubtropic * CONFIG.subtropicDrying);
}

/**
 * 计算一个图块的气候（温度、湿度），结果写回 tile 上。
 *
 * 温度：以太阳辐射为基础 —— 太阳高度角随纬度下降，入射能量正比于 cos(纬度)，
 *       而 center.y === sin(纬度)，所以 cos(纬度) = sqrt(1 - lat²)。
 *       再按「陆地相对高度」做气温直减（海拔越高越冷）。
 *
 * 湿度：三圈环流的纬向基础值，叠加噪声让气候边界不规则（避免出现完美的环带）。
 */
function computeClimate(tile) {
  const lat = tile.latitude;
  const absLat = Math.abs(lat);

  // --- 温度 ---
  const insolation = Math.sqrt(Math.max(0, 1 - lat * lat));   // = cos(地理纬度)
  // 陆地相对高度：海平面处为 0，最高峰为 1（这样平原不会平白无故被降温）
  const landRelief = Math.max(0, (tile.elevation - CONFIG.seaLevel) / (1 - CONFIG.seaLevel));
  const tempJitter = sampleNoise3D(
    tile.center.x * CONFIG.climateScale + OFFSET_D.x,
    tile.center.y * CONFIG.climateScale + OFFSET_D.y,
    tile.center.z * CONFIG.climateScale + OFFSET_D.z,
  );
  tile.temperature = clamp01(
    insolation - landRelief * CONFIG.lapseRate + tempJitter * CONFIG.tempNoise,
  );

  // --- 湿度 ---
  // ★ 阶段 A：乘性扰动（见 CONFIG.moistureNoise 的注释）。
  //   基础湿度来自三圈环流的纬向包络，`exp(jitter · k)` 给它加上大尺度的起伏，
  //   让气候边界不规则 —— 但**不会**把干旱区推成精确的 0。
  const base = latitudinalMoisture(absLat);
  const moistJitter = sampleNoise3D(
    tile.center.x * CONFIG.climateScale + OFFSET_E.x,
    tile.center.y * CONFIG.climateScale + OFFSET_E.y,
    tile.center.z * CONFIG.climateScale + OFFSET_E.z,
  );
  tile.moisture = clamp01(base * Math.exp(moistJitter * CONFIG.moistureNoise));
}

/**
 * 气候群系分类（★ H1：不再包含河流）。
 *
 * 判定顺序即优先级：
 *     海洋/海冰 > 高山（雪峰、山脉）> 极地冰原 > 温度带 > 湿度带
 *
 * 说明：
 * - 高山单独处理，因为雪线与纬度无关（赤道上的乞力马扎罗同样有冰川）。
 *   注意：山脉/雪峰在语义上同属「覆盖层」（见 §3.3 的 L2），之所以还留在本函数里，
 *   是因为阶段 D 会把它改造成真正的「成带山脉 + 温度雪线」；图例已先按语义分组。
 * - 温度带负责「冰原 / 苔原 / 针叶林 / 温带 / 热带」的南北分异，
 *   湿度带负责在温带与热带内部区分「沙漠 / 草原 / 森林」。
 *   两者缺一不可 —— 只靠温度做不出沙漠（赤道与副热带温度相近，
 *   差别全部来自降水）。
 * - 河流已移出本函数：它是覆盖层，由 H2 的 computeHydrology() 单独判定，
 *   渲染时也不再覆盖底层气候群系色（撒哈拉里的尼罗河，河床下就是沙漠黄）。
 */
function classifyBiome(tile) {
  const { elevation, latitude, temperature, moisture } = tile;
  const absLat = Math.abs(latitude);

  // 1. 海洋：极地海面结冰
  if (elevation <= CONFIG.seaLevel) {
    return absLat > CONFIG.seaIceLatitude ? BIOME.SEA_ICE : BIOME.OCEAN;
  }

  // 2. 高山：雪线以上为雪峰，其次为裸露山脉。与纬度无关
  if (elevation > SNOW_LEVEL) return BIOME.SNOW;
  if (elevation > MOUNTAIN_LEVEL) return BIOME.MOUNTAIN;

  // 3. 极地冰盖
  if (temperature < CONFIG.tempIce) return BIOME.ICE;

  // 4. 温度带：由寒到暖
  if (temperature < CONFIG.tempTundra) return BIOME.TUNDRA;
  if (temperature < CONFIG.tempTaiga) return BIOME.TAIGA;

  // 5. 温带 / 热带：在温度带内部再按湿度划分
  if (moisture < CONFIG.moistureDesert) return BIOME.DESERT;
  if (moisture < CONFIG.moistureGrassland) return BIOME.GRASSLAND;
  return temperature > CONFIG.tempTropical ? BIOME.RAINFOREST : BIOME.FOREST;
}

/**
 * 重跑「海拔 → 气候 → 群系」这条纯计算链（不碰渲染层）。
 *
 * 这条链只依赖 CONFIG 与图块的球面坐标，与渲染层完全解耦。而默认
 * `enableHeightOffset === false` 时海拔**不参与顶点坐标**（球面恒为半径 1），
 * 因此改完 CONFIG 只要调一次本函数就能看到新星球，不必重建几何体、也不必重载页面。
 * 这正是调参实验室（tools/lab-terrain.mjs）能在一次页面加载里扫几十组参数的原因。
 *
 * 唯一与渲染层相关的字段是 `baseColor`，它由 `repaintAll()` 从 `biome` 重新派生，
 * 所以这里只负责把 `biome` 算对，颜色的事交给调用方。
 *
 * ★ H2 会在 computeClimate 之后插入 computeHydrology(tiles)（水文需要海拔+湿度+温度三者），
 *   并在此处调用 computeRivers() 重建河网几何体 —— 见 docs/river-system-design.md §10.3。
 */
function recomputeTerrain() {
  computeElevations(tiles);
  for (const tile of tiles) {
    tile.latitude = tile.center.y;                // 纬度 ∈ [-1, 1]，即 sin(地理纬度)
    computeClimate(tile);                         // 由纬度与海拔推出温度、湿度
    tile.biome    = classifyBiome(tile);
  }
}

/* =========================================================================
 * §5  几何与渲染
 * ========================================================================= */

/**
 * 计算每个对偶顶点的半径（方案 B）。
 *
 * 对偶顶点 i 对应原网格中的三角形 faces[i]，它被 3 个多边形共享。
 * 半径取这 3 个多边形海拔的平均值，因此：
 *   - 每个对偶顶点只有唯一半径；
 *   - 任意两个相邻多边形引用同一条边的两个端点时，坐标完全相同 → 不会出现缝隙。
 */
function computeDualRadius(faces, polygons) {
  const radius = new Float64Array(faces.length);
  for (let fi = 0; fi < faces.length; fi++) {
    const [a, b, c] = faces[fi];
    const avgElevation =
      (polygons[a].elevation + polygons[b].elevation + polygons[c].elevation) / 3;
    radius[fi] = 1 + displacement(avgElevation);
  }
  return radius;
}

/**
 * 把全部图块合并成【一份】几何体 —— 整颗星球 = 1 个 Mesh = 1 个 draw call。
 *
 * ■ 为什么必须合并
 *   重构前每个图块一个 Mesh，level 5 就是 10242 个 Mesh，每帧 10242 次 draw call。
 *   手机 GPU 每帧的 draw call 预算只有几十到几百，超出约百倍 —— 必然卡顿。
 *   真正的瓶颈从来不是三角形数量（才 6 万个，对任何 GPU 都是小菜），
 *   而是 draw call 次数，以及每个 Mesh 各自的材质/包围盒/矩阵带来的 CPU 开销。
 *
 * ■ 顶点布局（索引化扇形）
 *   每个图块用「扇心 + n 个环顶点」= n+1 个顶点、n 个三角形。
 *   因为建了索引，n 个三角形共用同一个扇心顶点：
 *     六边形 18 个顶点 → 7 个；五边形 15 个 → 6 个。
 *   总顶点数从「不共享」的 184320 降到 71682，省掉约 61% 的顶点带宽。
 *
 * ■ 为什么不跨图块共享顶点（重要取舍）
 *   跨图块共享顶点 = 相邻图块共用同一个顶点，而一个顶点只能有一个颜色，
 *   于是相邻群系之间必然出现「顶点色插值渐变」，会毁掉本星球
 *   「每一格一个纯色」的设计语言（正是之前走过弯路的地方）。
 *   **只在图块内部共享扇心**，是保持每格纯色的前提下能拿到的最优解。
 *
 * ■ 法线
 *   直接取 position 归一化，也就是球面的**解析法线**，比 computeVertexNormals()
 *   的逐面平均更平滑（后者在球面上会带出网格状的细微起伏）。
 *   注意当前材质是 MeshBasicMaterial（完全不受光照），法线并不参与着色；
 *   保留它是为了将来换成光照材质时，球面依然是平滑的而不是多面体。
 *
 * ■ 返回值的映射表：渲染层与业务层之间唯一的桥
 *   triToTile[faceIndex] → 该三角形属于哪个图块        （拾取用）
 *   tileVertStart/Count  → 该图块占据哪一段顶点区间    （改色/高亮用）
 *   tileIndexStart/Count → 该图块占据哪一段索引区间    （调试用）
 */
function buildPlanetGeometry(tiles) {
  const nTiles = tiles.length;

  // ---- 1. 先统计总量，一次性分配定型数组（避免任何中间对象）----
  let totalVerts = 0;
  let totalIndices = 0;
  for (const tile of tiles) {
    const n = tile.vertices.length;   // 5（五边形）或 6（六边形）
    totalVerts += n + 1;
    totalIndices += n * 3;
  }

  const positions = new Float32Array(totalVerts * 3);
  const normals   = new Float32Array(totalVerts * 3);
  const colors    = new Float32Array(totalVerts * 3);
  // 顶点数 71682 > 65535，索引必须用 Uint32（WebGL2 原生支持，不需要扩展）
  const indices   = new Uint32Array(totalIndices);

  const triCount = totalIndices / 3;
  const triToTile      = new Uint32Array(triCount);
  const tileVertStart  = new Uint32Array(nTiles);
  const tileVertCount  = new Uint8Array(nTiles);    // 6 或 7
  const tileIndexStart = new Uint32Array(nTiles);

  const col = new THREE.Color();

  let vo = 0;   // 顶点写指针（单位：顶点数，不是分量数）
  let io = 0;   // 索引写指针
  let to = 0;   // 三角形写指针

  for (let ti = 0; ti < nTiles; ti++) {
    const tile = tiles[ti];
    const verts = tile.vertices;
    const n = verts.length;

    tileVertStart[ti]  = vo;
    tileVertCount[ti]  = n + 1;
    tileIndexStart[ti] = io;

    // ---- 2. 扇心：中心方向 × 顶点平均半径 ----
    // 取「中心方向 × 平均半径」而不是顶点坐标的算术平均：后者会落到球体内部
    // （造成内凹），且在图块各顶点半径不等时会偏离面片平面。
    let sumR = 0;
    for (const v of verts) sumR += v.length();
    const avgR = sumR / n;

    const base = vo;
    const cx = tile.center.x * avgR;
    const cy = tile.center.y * avgR;
    const cz = tile.center.z * avgR;

    // 群系本色（setHex 会按 three 的色彩管理把 sRGB 转到线性工作空间，
    // 因此写进顶点色后与重构前 material.color 的观感完全一致）
    col.setHex(BIOME_COLOR[tile.biome]);
    const cr = col.r, cg = col.g, cb = col.b;

    // 2.1 扇心顶点：法线即单位中心方向（center 本身已是单位向量）
    let p = vo * 3;
    positions[p] = cx; positions[p + 1] = cy; positions[p + 2] = cz;
    normals[p] = tile.center.x; normals[p + 1] = tile.center.y; normals[p + 2] = tile.center.z;
    colors[p] = cr; colors[p + 1] = cg; colors[p + 2] = cb;
    vo++;

    // 2.2 n 个环顶点
    for (let i = 0; i < n; i++) {
      const v = verts[i];
      p = vo * 3;
      positions[p] = v.x; positions[p + 1] = v.y; positions[p + 2] = v.z;
      const len = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z) || 1;
      normals[p] = v.x / len; normals[p + 1] = v.y / len; normals[p + 2] = v.z / len;
      colors[p] = cr; colors[p + 1] = cg; colors[p + 2] = cb;
      vo++;
    }

    // ---- 3. 索引：把 n 边形展开成 n 个三角形组成的扇形 ----
    // 环序由 buildDual 保证从球外看为逆时针，所以这里统一是正面朝外。
    for (let i = 0; i < n; i++) {
      indices[io++] = base;                       // 扇心
      indices[io++] = base + 1 + i;               // 环顶点 i
      indices[io++] = base + 1 + ((i + 1) % n);   // 环顶点 i+1
      triToTile[to++] = ti;                       // 这个三角形属于图块 ti
    }
  }

  // ---- 4. 组装 BufferGeometry ----
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('normal',   new THREE.BufferAttribute(normals, 3));
  geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geometry.setIndex(new THREE.BufferAttribute(indices, 1));
  geometry.computeBoundingSphere();   // 拾取与视锥剔除都要用

  return {
    geometry, positions, normals, colors, indices,
    triToTile, tileVertStart, tileVertCount, tileIndexStart,
    triCount, vertexCount: totalVerts,
  };
}

/** 简单的星空背景，纯装饰 */
function createStarfield() {
  const COUNT = 700;
  const positions = new Float32Array(COUNT * 3);
  const random = mulberry32(CONFIG.seed ^ 0x5F3759DF);
  for (let i = 0; i < COUNT; i++) {
    // 在半径 30~60 的球壳上均匀取点
    const u = random() * 2 - 1;
    const theta = random() * Math.PI * 2;
    const r = 30 + random() * 30;
    const s = Math.sqrt(1 - u * u);
    positions[i * 3]     = r * s * Math.cos(theta);
    positions[i * 3 + 1] = r * u;
    positions[i * 3 + 2] = r * s * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x9fb6d0, size: 0.16, sizeAttenuation: true,
    transparent: true, opacity: 0.75,
  });
  const stars = new THREE.Points(geo, mat);
  stars.matrixAutoUpdate = false;
  return stars;
}
scene.add(createStarfield());

/* =========================================================================
 * §7  交互：射线拾取、高亮、选中、覆盖层显隐、矿石层、HUD
 * -------------------------------------------------------------------------
 * 三条设计约束（都来自移动端性能预算）：
 *   ① 拾取：一次 raycaster.intersectObject(唯一个 Mesh)，用 faceIndex 查表。
 *   ② 高亮/选中：只改顶点色的一个小区间并局部上传，**不新建任何 Mesh**。
 *   ③ 矿石：全部共用一个 InstancedMesh 与一份材质，draw call 只 +1。
 * ========================================================================= */

/** 渲染层句柄。由 init() 装配；业务数据（tiles / world）完全不依赖它 */
const gfx = {
  mesh: null,          // 唯一的星球 Mesh
  colors: null,        // 顶点色 Float32Array（就是 geometry 的 color 属性用的那个数组）
  colorAttr: null,     // 顶点色 BufferAttribute，用于区间更新
  triToTile: null,     // 三角形序号 → 图块序号
  tileVertStart: null, // 图块 → 顶点区间起点
  tileVertCount: null, // 图块 → 顶点区间长度
  outline: null,       // 可复用的选中描边（整颗星球永远只有 1 个）
  outlinePos: null,
  oreLayer: null,      // 矿石层（InstancedMesh，第一次放矿时才创建）
};

const ORE_CAPACITY = 512;

let tiles = [];            // 业务数据：每格的群系/海拔/气候（init 中填充）
let hoveredIndex = -1;     // 悬停中的图块（-1 = 无）
let selectedIndex = -1;    // 选中的图块（-1 = 无）
let needsPick = false;     // 拾取请求：合并到动画循环里执行，避免事件风暴
let pointerInside = false;
let lastPointerX = 0;
let lastPointerY = 0;

/**
 * 业务数据层。
 *
 * 这一层是纯 JS 数组，渲染层只按「有了就画」的规则读它，
 * 完全不知道 ore 是矿、owner 是势力 —— 将来加资源/归属/出生地只改这里。
 */
const world = {
  ore: null,         // Int8Array：0 = 无矿，>0 = 矿种 id
  oreAmount: null,   // Uint16Array：储量
  owner: null,       // Int16Array：归属，-1 = 无主

  /**
   * 水文层（★ H1 先立空壳，H2 由 computeHydrology() 填充）。
   *
   * 纯数据、一次性算完、运行时不重算，渲染层不感知。契约见
   * docs/river-system-design.md §6.1：
   *   adj      Int32Array[]   邻接表（公共设施：水文与将来所有相邻关系计算的公共输入）
   *   filled   Float32Array   填平后的水面高程（≥ elevation）
   *   depth    Float32Array   filled − elevation（= 湖深，正数即被淹格）
   *   down     Int32Array     主下游（argmax 权重）；-1 = 入海 / 内流终点
   *   accum    Float32Array   汇水量（按降水量加权，实数量纲）
   *   isRiver  Uint8Array     1 = 该格有河道穿过
   *   lakeId   Int32Array     -1 = 非湖；否则湖泊编号
   *   lakes    []             湖泊属性表 { id, area, depth, level, isEndorheic, ... }
   */
  hydro: null,
};

/**
 * 覆盖层显隐状态（★ H1 引入）。
 *
 * 「覆盖层」= 与气候群系正交的地形/水文层。实现规则只有一条
 * （见 docs/river-system-design.md §3.2）：
 *   「面」类（湖面 / 山带 / 雪线）→ 直接改底层顶点色 → 0 draw call
 *   「线」类（河流 / 将来可选的山脊线、等深线）→ 独立几何体 → 一层各 1 次
 * 这里只存"用户想不想看"，各层自己去读；因此加一层不改这个结构。
 */
const overlayVisible = {
  ore: true,     // 矿石符号层（已实现，InstancedMesh）
  river: true,   // 河网层（H3 实现）
  lake: true,    // 湖泊覆盖（H4 实现，走顶点色而非独立层）
};

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const WHITE = new THREE.Color(0xffffff);
const SELECTION_COLOR = new THREE.Color(CONFIG.selectionColor);
const scratchColor = new THREE.Color();

const hudEl = document.getElementById('hud');
const hudBiome = document.getElementById('hud-biome');
const hudTemp = document.getElementById('hud-temp');
const hudMoist = document.getElementById('hud-moist');
const hudElev = document.getElementById('hud-elev');
const hudLat = document.getElementById('hud-lat');
const hudLon = document.getElementById('hud-lon');
const hudHydro = document.getElementById('hud-hydro');
const hudId = document.getElementById('hud-id');
const hudState = document.getElementById('hud-state');

function updateHud(tile) {
  // center.y 即 sin(地理纬度)；经度以 +Z 为 0°、向东为正
  const latDeg = Math.asin(clamp(tile.center.y, -1, 1)) * 180 / Math.PI;
  const lonDeg = Math.atan2(tile.center.x, tile.center.z) * 180 / Math.PI;

  hudBiome.textContent = BIOME_LABEL[tile.biome];
  hudTemp.textContent = tile.temperature.toFixed(3);
  hudMoist.textContent = tile.moisture.toFixed(3);
  hudElev.textContent = tile.elevation.toFixed(3);
  hudLat.textContent = `${latDeg >= 0 ? 'N' : 'S'} ${Math.abs(latDeg).toFixed(1)}°`;
  hudLon.textContent = `${lonDeg >= 0 ? 'E' : 'W'} ${Math.abs(lonDeg).toFixed(1)}°`;
  // 水系（★ H1 占位）：水文数据层在 H2 由 computeHydrology() 填进 world.hydro，
  // 之后这里显示「汇水量 / 是否河道 / 河源 / 河口 / 湖泊 / 内流盆地」。
  hudHydro.textContent = '—';
  hudId.textContent = `#${tile.index} · ${tile.vertexIndices.length} 边形`;
}

/* -------------------------------------------------------------------------
 * 7.1  顶点色：高亮 / 选中
 * ------------------------------------------------------------------------- */

/** 一个图块「当前该显示的颜色」= 群系本色 + 悬停/选中的瞬时提亮（选中优先） */
function computeTileColor(ti, out) {
  out.copy(tiles[ti].baseColor);
  if (ti === selectedIndex) {
    out.lerp(SELECTION_COLOR, CONFIG.selectionTint);
  } else if (ti === hoveredIndex) {
    out.lerp(WHITE, CONFIG.hoverTint);
  }
  return out;
}

/** 把图块 ti「当前该显示的颜色」写进顶点色数组。只写数组，不负责标记脏区间。 */
function writeTileColor(ti) {
  computeTileColor(ti, scratchColor);
  const start = gfx.tileVertStart[ti];
  const count = gfx.tileVertCount[ti];
  const colors = gfx.colors;
  const r = scratchColor.r, g = scratchColor.g, b = scratchColor.b;
  for (let i = start, end = start + count; i < end; i++) {
    const p = i * 3;
    colors[p] = r; colors[p + 1] = g; colors[p + 2] = b;
  }
  return { start, count };
}

/**
 * 改一格的颜色，并**只把这一小段**标为脏。
 *
 * 每次只改 6~7 个顶点（约 84 字节），而不是重传整个 0.86 MB 的颜色缓冲 ——
 * 这是「高亮不新建 Mesh」能做到近乎零成本的关键。
 * three r159+ 的 BufferAttribute.addUpdateRange() 会把它变成一次
 * gl.bufferSubData 区间上传（WebGL2 路径），代价可以忽略。
 */
function repaintTile(ti) {
  if (ti < 0 || !gfx.colorAttr) return;
  const { start, count } = writeTileColor(ti);
  const attr = gfx.colorAttr;
  if (typeof attr.addUpdateRange === 'function') attr.addUpdateRange(start * 3, count * 3);
  attr.needsUpdate = true;   // 没有 addUpdateRange 的老版本 three 会退化成整体上传，依然正确
}

/**
 * 整体重着色（换种子、调参、调试筛选群系后调用）。
 *
 * 这里刻意走「整段上传」而不是逐格标脏：10242 个区间会让 three 打 1 万多次
 * bufferSubData，反而比传一次 0.86 MB 慢得多。
 * ⚠️ 必须先清掉可能残留的区间标记 —— 只要 updateRanges 非空，three 就只上传
 * 那几个区间，其余改动会被静默吞掉。
 */
function repaintAll() {
  const attr = gfx.colorAttr;
  if (!attr) return;
  if (typeof attr.clearUpdateRanges === 'function') attr.clearUpdateRanges();
  for (let ti = 0; ti < tiles.length; ti++) writeTileColor(ti);
  attr.needsUpdate = true;
}

function setHovered(ti) {
  if (ti === hoveredIndex) return;
  const prev = hoveredIndex;
  hoveredIndex = ti;
  if (prev >= 0) repaintTile(prev);
  if (ti >= 0) repaintTile(ti);
  refreshHud();
}

function setSelected(ti) {
  if (ti === selectedIndex) return;
  const prev = selectedIndex;
  selectedIndex = ti;
  if (prev >= 0) repaintTile(prev);
  if (ti >= 0) repaintTile(ti);
  updateOutline();
  refreshHud();
}

function refreshHud() {
  // 悬停优先显示悬停的那格；鼠标移开后继续显示选中格
  const ti = hoveredIndex >= 0 ? hoveredIndex : selectedIndex;
  if (ti < 0) {
    hudEl.classList.remove('visible');
    return;
  }
  updateHud(tiles[ti]);
  hudState.textContent = selectedIndex === ti ? '已选中' : '悬停';
  hudEl.classList.add('visible');
}

/* -------------------------------------------------------------------------
 * 7.2  选中描边：整颗星球只有 1 个可复用的 LineLoop
 * ------------------------------------------------------------------------- */

function ensureOutline() {
  if (gfx.outline) return gfx.outline;

  const geometry = new THREE.BufferGeometry();
  // 最多 6 个环顶点（六边形）；五边形用 drawRange 只画前 5 个
  geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6 * 3), 3));
  const material = new THREE.LineBasicMaterial({
    // 描边刻意用白色而不是选中色：选中色已经把格子内部染成青蓝，
    // 同色描边等于没有描边。白色边框才能和群系色、也和选中色都拉开对比。
    color: 0xffffff, transparent: true, opacity: 0.9, depthTest: true,
  });
  const line = new THREE.LineLoop(geometry, material);
  line.frustumCulled = false;     // 顶点在运行时被替换，交给它自己算包围球反而不划算
  line.visible = false;
  line.matrixAutoUpdate = false;
  line.updateMatrix();

  gfx.outline = line;
  gfx.outlinePos = geometry.attributes.position;
  planetGroup.add(line);          // planetGroup 的子对象，随星球一起转
  return line;
}

/**
 * 把描边顶点搬到当前选中的图块上。
 * 只改坐标、不新建对象 —— 将来放「矿石/出生地标记」也是同一套路。
 */
function updateOutline() {
  const line = ensureOutline();

  if (selectedIndex < 0) {
    line.visible = false;
    return;
  }

  const ti = selectedIndex;
  const ringStart = gfx.tileVertStart[ti] + 1;        // +1 跳过扇心，取环顶点
  const ringCount = gfx.tileVertCount[ti] - 1;        // 环顶点个数（5 或 6）
  const src = gfx.mesh.geometry.attributes.position.array;
  const dst = gfx.outlinePos.array;
  const R = 1.004;   // 沿半径略微外扩，避免与球面共面产生 z-fighting

  for (let i = 0; i < ringCount; i++) {
    const s = (ringStart + i) * 3;
    dst[i * 3]     = src[s]     * R;
    dst[i * 3 + 1] = src[s + 1] * R;
    dst[i * 3 + 2] = src[s + 2] * R;
  }
  gfx.outlinePos.needsUpdate = true;
  line.geometry.setDrawRange(0, ringCount);
  line.visible = true;
}

/* -------------------------------------------------------------------------
 * 7.3  拾取
 * ------------------------------------------------------------------------- */

/**
 * 屏幕坐标 → 图块序号（-1 = 没命中）。
 *
 * ■ faceIndex → 图块：为什么不能简单用 Math.floor(faceIndex / 6)
 *   12 个五边形每个只有 5 个三角形，而六边形有 6 个，
 *   所以「三角形序号 / 6」在五边形之后会整体错位（每遇到一个五边形就错 1）。
 *   buildPlanetGeometry() 在打包时逐三角形记录了 triToTile，这里直接查表：
 *   精确、O(1)、天然兼容五边形。
 *
 * ■ 性能
 *   只对 1 个 Mesh 做射线求交；raycaster 会先用几何体包围球快速剔除，
 *   并且会因为材质是 FrontSide 而跳过背面三角形，实际只测正面约一半。
 */
function pickTile(clientX, clientY) {
  if (!gfx.mesh) return -1;

  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  // OrbitControls 只改相机的位置与朝向，matrixWorld 要到 render 时才刷新。
  // 这里主动更新一次，保证拾取结果与当前画面同步（否则快速旋转时会差 1 帧）。
  camera.updateMatrixWorld();
  raycaster.setFromCamera(pointerNDC, camera);

  const hits = raycaster.intersectObject(gfx.mesh, false);
  if (hits.length === 0) return -1;

  const faceIndex = hits[0].faceIndex;
  if (faceIndex === undefined) return -1;
  const ti = gfx.triToTile[faceIndex];
  return ti === undefined ? -1 : ti;
}

/* -------------------------------------------------------------------------
 * 7.4  矿石层：全部矿共用一个 InstancedMesh
 * ------------------------------------------------------------------------- */

const ORE_COLORS = { 1: 0xffd45e, 2: 0xb9c6d4, 3: 0x7fd3a8 };   // 矿种 → 颜色
const oreTiles = [];        // 有矿的图块序号（业务侧）
const oreMatrix = new THREE.Matrix4();
const oreQuat = new THREE.Quaternion();
const orePos = new THREE.Vector3();
const oreScale = new THREE.Vector3(1, 1, 1);
const ORE_UP = new THREE.Vector3(0, 1, 0);

function createOreLayer() {
  // 八面体当作矿石图标；一份几何体 + 一份材质，靠 instanceColor 区分矿种
  const geometry = new THREE.OctahedronGeometry(0.022, 0);
  const material = new THREE.MeshBasicMaterial({ color: 0xffffff, vertexColors: false });
  const inst = new THREE.InstancedMesh(geometry, material, ORE_CAPACITY);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  inst.count = 0;
  inst.visible = false;
  inst.frustumCulled = false;
  inst.matrixAutoUpdate = false;
  inst.updateMatrix();
  gfx.oreLayer = inst;
  planetGroup.add(inst);
  return inst;
}

/** 业务 API：给某格放一份矿（typeId 决定颜色，储量只写进业务数组） */
function setOre(ti, typeId = 1, amount = 100) {
  if (!world.ore || ti < 0 || ti >= tiles.length) return;
  if (world.ore[ti] === 0) oreTiles.push(ti);
  world.ore[ti] = typeId;
  world.oreAmount[ti] = amount;
  syncOreLayer();
}

function clearOres() {
  if (world.ore) world.ore.fill(0);
  oreTiles.length = 0;
  syncOreLayer();
}

/** 把业务侧的矿石清单同步到渲染侧。无论多少矿，draw call 只增加 1。 */
function syncOreLayer() {
  if (oreTiles.length > ORE_CAPACITY) {
    console.warn(`[矿石] 超出实例容量 ${ORE_CAPACITY}，多余的不会显示`);
  }
  if (!gfx.oreLayer && oreTiles.length === 0) return;
  const inst = gfx.oreLayer || createOreLayer();

  const n = Math.min(oreTiles.length, ORE_CAPACITY);
  for (let i = 0; i < n; i++) {
    const tile = tiles[oreTiles[i]];
    orePos.copy(tile.center).multiplyScalar(1.02);          // 浮在球面之上一点
    oreQuat.setFromUnitVectors(ORE_UP, tile.center);         // 让八面体朝外
    oreMatrix.compose(orePos, oreQuat, oreScale);
    inst.setMatrixAt(i, oreMatrix);
    inst.setColorAt(i, scratchColor.setHex(ORE_COLORS[world.ore[oreTiles[i]]] || 0xffd45e));
  }
  inst.count = n;
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  inst.visible = n > 0 && overlayVisible.ore;   // 没矿 / 被覆盖层开关关掉时彻底不绘制（连 1 次 draw call 都不花）
}

/**
 * 覆盖层显隐（与 setVisibleBiomes 并列，见 docs/river-system-design.md §6.3）。
 *
 *   setVisibleOverlays(['river'])   → 只保留河网层
 *   setVisibleOverlays(['ore'])     → 只保留矿石符号层
 *   setVisibleOverlays(null / [])   → 全部恢复
 *
 * 与 setVisibleBiomes 的差别：群系筛选靠改顶点色（0 成本），覆盖层各自按
 * 「面走顶点色 / 线走独立几何体」实现，所以这里只是把开关状态记下来，
 * 由各层自己去读（例如 syncOreLayer 读 overlayVisible.ore）。
 *
 * ★ H1 现状：只有 'ore' 是真实存在的层；'river'（H3）、'lake'（H4）会先记住状态，
 *   图层实现后立即生效 —— 现在调用它们不报错，也不会有任何视觉变化。
 */
function setVisibleOverlays(list) {
  const keep = list && list.length ? new Set(list) : null;
  for (const key of Object.keys(overlayVisible)) overlayVisible[key] = !keep || keep.has(key);
  if (gfx.oreLayer) gfx.oreLayer.visible = overlayVisible.ore && gfx.oreLayer.count > 0;
  return { ...overlayVisible };
}

/* -------------------------------------------------------------------------
 * 7.5  事件绑定
 * ------------------------------------------------------------------------- */

function setupInteraction() {
  const dom = renderer.domElement;
  let downX = 0, downY = 0, downTime = 0, downId = -1;

  dom.addEventListener('pointermove', (ev) => {
    // 触屏没有「悬停」概念，整条悬停拾取链路直接跳过（省掉触屏上最贵的开销）
    if (ev.pointerType !== 'mouse') return;
    lastPointerX = ev.clientX;
    lastPointerY = ev.clientY;
    pointerInside = true;
    needsPick = true;      // 真正的拾取合并到动画循环里执行
  });

  dom.addEventListener('pointerleave', () => {
    pointerInside = false;
    needsPick = true;
  });

  // 触屏与鼠标共用：按下 → 抬起 之间位移足够小才算「点选」，
  // 否则视为拖动旋转（OrbitControls 在监听同一批事件）。
  dom.addEventListener('pointerdown', (ev) => {
    downId = ev.pointerId;
    downX = ev.clientX;
    downY = ev.clientY;
    downTime = performance.now();
  });

  dom.addEventListener('pointerup', (ev) => {
    if (ev.pointerId !== downId) return;
    downId = -1;
    if (Math.hypot(ev.clientX - downX, ev.clientY - downY) > 8) return;   // 拖动
    if (performance.now() - downTime > 700) return;                       // 长按
    setSelected(pickTile(ev.clientX, ev.clientY));                        // 点空白 = -1 = 取消选中
  });

  dom.addEventListener('pointercancel', () => { downId = -1; });
}

/* =========================================================================
 * §8  动画循环与窗口自适应
 * ========================================================================= */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  if (CONFIG.enableRotation) {
    planetGroup.rotation.y += CONFIG.rotationSpeed * dt;
  }

  controls.update();

  if (needsPick) {
    needsPick = false;
    setHovered(pointerInside ? pickTile(lastPointerX, lastPointerY) : -1);
  }

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

/* =========================================================================
 * §9  图例
 * ========================================================================= */
/**
 * 图例（★ H1 起分两组）。
 *
 * 分组不是装饰，而是「分层地表模型」在 UI 上的体现（见 river-system-design.md §3.1）：
 *   - 气候群系：温度 + 湿度决定的原生地表覆盖 → 逐格顶点色
 *   - 覆盖层  ：海拔 + 水决定的、与气候正交的地形水文 → 面走顶点色 / 线走独立几何体
 * 山脉与雪峰当前仍由 classifyBiome() 产出（阶段 D 会把它改造成真正的覆盖层），
 * 但语义上属于覆盖层，所以先放进右边那一组。空组不渲染，避免出现光头标题。
 */
function buildLegend() {
  const el = document.getElementById('legend');
  const groups = [
    { title: '气候群系', biomes: [
      BIOME.OCEAN, BIOME.SEA_ICE, BIOME.ICE, BIOME.TUNDRA, BIOME.TAIGA,
      BIOME.FOREST, BIOME.RAINFOREST, BIOME.GRASSLAND, BIOME.DESERT,
    ] },
    { title: '覆盖层', biomes: [
      BIOME.MOUNTAIN, BIOME.SNOW,
      /* H3/H4 起：河流 / 湖泊 / 内流盆地 / 盐湖 */
    ] },
  ];
  el.innerHTML = groups.filter((g) => g.biomes.length).map((g) =>
    `<div class="group">${g.title}</div>` +
    g.biomes.map((b) => {
      const hex = '#' + BIOME_COLOR[b].toString(16).padStart(6, '0');
      return `<div class="item"><span class="swatch" style="background:${hex}"></span>${BIOME_LABEL[b]}</div>`;
    }).join(''),
  ).join('');
}

/* =========================================================================
 * §10  自测：验证网格与地形数据是否符合预期
 * ========================================================================= */
function runSelfTest(tiles) {
  const rows = [];
  const check = (name, ok, detail) => rows.push({ name, ok: !!ok, detail: detail ?? '' });

  const expectedFaces = 10 * 4 ** CONFIG.level + 2;
  check('图块总数', tiles.length === expectedFaces, `${tiles.length} / 期望 ${expectedFaces}`);

  const pentagons = tiles.filter((t) => t.vertexIndices.length === 5).length;
  const hexagons = tiles.filter((t) => t.vertexIndices.length === 6).length;
  check('五边形数量 = 12', pentagons === 12, `${pentagons}`);
  check('其余均为六边形', pentagons + hexagons === tiles.length, `六边形 ${hexagons}`);

  check('elevation ∈ [0,1]', tiles.every((t) => t.elevation >= 0 && t.elevation <= 1));
  check('center 为单位向量', tiles.every((t) => Math.abs(t.center.length() - 1) < 1e-9));
  check('无 NaN', tiles.every((t) =>
    Number.isFinite(t.center.x + t.center.y + t.center.z) && Number.isFinite(t.elevation)));

  // 无缝隙：同一个对偶顶点索引，在任何图块中都必须指向同一个 Vector3 实例
  let sharedRefs = true;
  const owner = new Map();
  for (const t of tiles) {
    for (let i = 0; i < t.vertexIndices.length; i++) {
      const key = t.vertexIndices[i];
      if (owner.has(key)) {
        if (owner.get(key) !== t.vertices[i]) sharedRefs = false;
      } else {
        owner.set(key, t.vertices[i]);
      }
    }
  }
  check('共享顶点为同一引用（无缝隙）', sharedRefs);

  // ---- 合并几何体与 triToTile 映射（渲染架构正确性的核心检查）----
  if (gfx.mesh) {
    const geometry = gfx.mesh.geometry;
    const indexArr = geometry.index.array;
    const posArr = geometry.attributes.position.array;
    const colAttr = geometry.attributes.color;
    const triCount = indexArr.length / 3;

    check('triToTile 长度 = 三角形总数', gfx.triToTile.length === triCount,
      `${gfx.triToTile.length} / ${triCount}`);
    check('顶点色属性与位置属性等长', colAttr.array.length === posArr.length,
      `${colAttr.array.length} / ${posArr.length}`);
    check('索引用 Uint32（顶点数超过 65535）', indexArr instanceof Uint32Array,
      indexArr.constructor.name);

    // 每格顶点数 = 边数 + 1（图块内部共享扇心）
    let vertOK = true, vertBad = -1;
    for (const t of tiles) {
      if (gfx.tileVertCount[t.index] !== t.vertexIndices.length + 1) { vertOK = false; vertBad = t.index; break; }
    }
    check('每格顶点数 = 边数 + 1（扇心共享）', vertOK, vertOK ? `共省下 ${triCount * 3 - posArr.length / 3} 个顶点` : `图块 ${vertBad}`);

    // 逐三角形校验：三角形 t 的三个顶点必须全部落在 triToTile[t] 的顶点区间内。
    // 这条通过就说明 faceIndex → 图块 的查表是精确的（含 12 个五边形）。
    let triOK = true, triBad = -1;
    for (let t = 0; t < triCount; t++) {
      const ti = gfx.triToTile[t];
      const lo = gfx.tileVertStart[ti];
      const hi = lo + gfx.tileVertCount[ti];
      const a = indexArr[t * 3], b = indexArr[t * 3 + 1], c = indexArr[t * 3 + 2];
      if (a < lo || a >= hi || b < lo || b >= hi || c < lo || c >= hi) { triOK = false; triBad = t; break; }
    }
    check('triToTile 逐三角形精确（含 12 个五边形）', triOK,
      triOK ? `${triCount} 个三角形全部正确` : `首个错在三角形 ${triBad}`);

    // 五边形与六边形的三角形数必须分别是 5 与 6
    let polyOK = true;
    for (const t of tiles) if (gfx.tileVertCount[t.index] - 1 !== t.vertexIndices.length) polyOK = false;
    check('三角形与多边形边数一一对应', polyOK);

    let meshCount = 0;
    scene.traverse((o) => { if (o.isMesh) meshCount++; });
    check('场景中星球主体仅 1 个 Mesh', meshCount === 1, `实际 ${meshCount} 个 Mesh`);
  }

  // ---- 分层地表模型（★ H1）：河流必须是「覆盖层」，不再是一个群系 ----
  check('群系表中已无河流（河流属覆盖层）',
    !Object.values(BIOME).includes('river') && !('river' in BIOME_COLOR) && !('river' in BIOME_LABEL));
  check('图块上无残留的 river 字段', tiles.every((t) => t.river === undefined));
  check('world.hydro 空壳 + 覆盖层显隐 API 已就位',
    'hydro' in world && typeof setVisibleOverlays === 'function' && 'river' in overlayVisible);

  // 生物群系统计
  const stats = {};
  for (const t of tiles) stats[t.biome] = (stats[t.biome] || 0) + 1;
  const statText = Object.keys(BIOME_LABEL)
    .map((b) => `${BIOME_LABEL[b]} ${stats[b] || 0}`)
    .join(' · ');

  console.groupCollapsed(
    `%c[自测] Goldberg 球体 · level=${CONFIG.level} · ${tiles.length} 个图块`,
    'color:#6cf;font-weight:bold',
  );
  console.table(rows.map((r) => ({
    检查项: r.name, 结果: r.ok ? '✅ 通过' : '❌ 失败', 详情: r.detail,
  })));
  console.log('生物群系分布：' + statText);
  // 注意：报告的是"水域"= 海洋群系 + 海冰，**不是**"elevation ≤ seaLevel"的格数。
  // 两者在极地会差一整圈海冰（当前 level 5 下约 6 个百分点），是最容易被误读的一个数字。
  const water = (stats[BIOME.OCEAN] || 0) + (stats[BIOME.SEA_ICE] || 0);
  console.log(`水域占比：${(water / tiles.length * 100).toFixed(1)}%（海冰 ${stats[BIOME.SEA_ICE] || 0} 格 + 海洋群系 ${stats[BIOME.OCEAN] || 0} 格）`);
  console.log(`陆地占比：${(100 - water / tiles.length * 100).toFixed(1)}%（= 海平面以上的格数，与工具链口径一致）`);
  console.groupEnd();

  const failed = rows.filter((r) => !r.ok);
  if (failed.length > 0) {
    console.error('自测未通过：', failed.map((r) => r.name).join('、'));
  }
  return { rows, stats };
}

/* =========================================================================
 * §11  启动
 * ========================================================================= */
function init() {
  // --- 1. 生成球体网格（对偶图）---
  const ico  = buildIcosahedron();                                    // 12 个已归一化顶点 / 20 面
  const mesh = subdivide(ico.vertices, ico.faces, CONFIG.level);      // 细分并投影到单位球面
  const dual = buildDual(mesh.vertices, mesh.faces);                  // { dualPos, polygons }

  tiles = dual.polygons;
  tiles.forEach((tile, i) => { tile.index = i; });

  // --- 2. 生成地形数据（海拔 → 气候 → 群系，纯计算，不碰渲染）---
  //     H2 会在气候之后接上水文（海拔 + 湿度 + 温度 三者齐备才能算产流与填平）。
  recomputeTerrain();

  // --- 3. 计算渲染坐标 ---
  // 关闭高度偏移时，直接复用归一化后的对偶顶点：
  // 所有图块共享同一批 Vector3 实例，球面严格为半径 1 的光滑球面，
  // 相邻图块共享边的坐标完全一致 —— 既无缝隙，也无高低疙瘩。
  let renderPos;
  if (CONFIG.enableHeightOffset) {
    const dualRadius = computeDualRadius(mesh.faces, tiles);   // 方案 B：共享半径
    renderPos = dual.dualPos.map((p, i) => p.clone().multiplyScalar(dualRadius[i]));
  } else {
    renderPos = dual.dualPos;
  }

  // --- 4. 构建渲染层：全部图块合并成 1 个 Mesh ---
  planetGroup.clear();
  gfx.oreLayer = null;      // planetGroup.clear() 之后旧的引用已失效
  gfx.outline = null;       // 描边也是 planetGroup 的子对象，同样要作废
  gfx.outlinePos = null;

  for (const tile of tiles) {
    // 4.1 拓扑索引 → 渲染坐标。多个图块共享同一批 Vector3 实例，故共享边坐标完全一致
    tile.vertices = tile.vertexIndices.map((i) => renderPos[i]);

    let sumR = 0;
    for (const v of tile.vertices) sumR += v.length();
    tile.avgRadius = sumR / tile.vertices.length;

    // 4.2 群系本色（线性空间）。高亮/选中时以它为基准做瞬时提亮
    tile.baseColor = new THREE.Color(BIOME_COLOR[tile.biome]);
  }

  // 4.3 一次性打包成单一几何体。返回的映射表是「渲染 → 业务」唯一的桥
  const packed = buildPlanetGeometry(tiles);
  gfx.triToTile = packed.triToTile;
  gfx.tileVertStart = packed.tileVertStart;
  gfx.tileVertCount = packed.tileVertCount;
  gfx.colors = packed.colors;
  gfx.colorAttr = packed.geometry.attributes.color;

  // 4.4 唯一的一份材质。顶点色负责表达群系，因此**不需要**按群系拆分材质。
  //     side 用 FrontSide：环序已由 buildDual 保证正面朝外，背面永远被自身遮住，
  //     剔除背面既省填充率，也让射线拾取少测一半三角形。
  const planetMaterial = new THREE.MeshBasicMaterial({
    vertexColors: true,       // 颜色全部来自几何体的 color 属性
    side: THREE.FrontSide,
  });

  gfx.mesh = new THREE.Mesh(packed.geometry, planetMaterial);
  gfx.mesh.matrixAutoUpdate = false;   // 几何体坐标已在世界空间里，mesh 自身永不移动
  gfx.mesh.updateMatrix();
  planetGroup.add(gfx.mesh);

  // --- 5. 业务数据层 ---
  world.ore = new Int8Array(tiles.length);
  world.oreAmount = new Uint16Array(tiles.length);
  world.owner = new Int16Array(tiles.length).fill(-1);

  // --- 6. 交互与循环 ---
  setupInteraction();
  buildLegend();

  // 自测结果留一份给验收脚本读（tools/verify-terrain.mjs 会断言"无失败项"），
  // 否则页面自测只能靠人眼看控制台，机器验不到。
  const selfTest = CONFIG.debugAssert ? runSelfTest(tiles) : null;

  animate();

  const loadingEl = document.getElementById('loading');
  if (loadingEl) loadingEl.remove();
  window.__planetReady = true;

  const drawCalls = renderer.info.render.calls;
  console.log(
    `%c星球生成完毕：level=${CONFIG.level}，图块 ${tiles.length} 个，` +
    `其中五边形 ${tiles.filter((t) => t.vertexIndices.length === 5).length} 个。`,
    'color:#6cf',
  );
  console.log(
    `%c渲染架构：1 个 Mesh（合并几何体）· 顶点 ${packed.vertexCount} 个 · ` +
    `三角形 ${packed.triCount} 个 · draw call ${drawCalls} 次/帧`,
    'color:#6cf;font-weight:bold',
  );
  console.log('提示：修改代码顶部 CONFIG 中的 seed 可换一颗星球。');

  // --- 7. 调参 / 集成出口 ---
  // 气候 / 分类都是纯函数（只依赖 CONFIG 与图块数据），所以改完 CONFIG 直接调
  // __PLANET__.refresh() 就能看到新结果，不必重建几何体、也不必重载页面。
  // 调参时每次重载页面要十几秒，这个出口能省掉绝大部分等待。
  window.__PLANET__ = {
    /* 配置与常量表 */
    CONFIG, BIOME, BIOME_COLOR, BIOME_LABEL,

    /* 业务数据层（纯 JS，渲染层不感知） */
    tiles, world,

    /* 渲染层句柄 */
    scene, camera, renderer, controls, planetGroup,
    gfx,
    get planetMesh() { return gfx.mesh; },

    /* 渲染 → 业务 的映射 */
    triToTile: gfx.triToTile,
    tileVertStart: gfx.tileVertStart,
    tileVertCount: gfx.tileVertCount,

    /* 拾取与选中 */
    pickTile,
    select: setSelected,
    setHovered,
    getSelected: () => selectedIndex,
    getHovered: () => hoveredIndex,

    /* 矿石层（演示"加资源不增加 draw call"的套路） */
    setOre, clearOres,

    /* 覆盖层（★ H1 起与「气候群系」分层；见 docs/river-system-design.md §3.2）
       hydro()            —— 水文数据（H1 为 null，H2 起有值）
       setVisibleOverlays —— ['river'] / ['ore'] / null（全部恢复） */
    hydro: () => world.hydro,
    setVisibleOverlays,
    overlays: () => ({ ...overlayVisible }),

    /* 顶点色 */
    repaintTile, repaintAll,

    /**
     * 调试：只显示指定的群系，其余格子调成背景色（截图对比用）。
     * 传 null / 空数组恢复全部。因为只有 1 个 Mesh，这里靠改顶点色实现，
     * draw call 依旧是 1。
     */
    setVisibleBiomes(list) {
      const keep = list && list.length ? new Set(list) : null;
      for (const tile of tiles) {
        // 被筛掉的格子刷成背景色。用 copy 而不是 getHex/setHex 往返，避免色彩空间来回转换
        if (keep && !keep.has(tile.biome)) tile.baseColor.copy(scene.background);
        else tile.baseColor.setHex(BIOME_COLOR[tile.biome]);
      }
      repaintAll();
      return keep ? keep.size : 'all';
    },

    /** 重跑整条地形链「海拔 → 气候 → 群系 → 顶点色」，返回新的群系计数 */
    refresh() {
      recomputeTerrain();
      const stats = {};
      for (const tile of tiles) {
        tile.baseColor.setHex(BIOME_COLOR[tile.biome]);
        stats[tile.biome] = (stats[tile.biome] || 0) + 1;
      }
      repaintAll();
      return stats;
    },

    /* 自测结果（页面内跑的那 17 条；验收脚本断言"无失败项"，免得只能靠人眼看控制台） */
    selfTest,

    /* 性能计数（验收用） */
    stats() {
      const info = renderer.info;
      let meshCount = 0, objectCount = 0;
      scene.traverse((o) => { objectCount++; if (o.isMesh) meshCount++; });
      return {
        drawCalls: info.render.calls,
        triangles: info.render.triangles,
        geometries: info.memory.geometries,
        textures: info.memory.textures,
        programs: info.programs ? info.programs.length : -1,
        meshCount, objectCount,
        tileCount: tiles.length,
      };
    },
  };
}

// 延后一帧执行，让 loading 文案有机会被绘制出来
requestAnimationFrame(() => {
  try {
    init();
  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML =
      '初始化失败，请查看控制台。<br><br>' +
      `<span style="color:#e08f8f">${String(err && err.message ? err.message : err)}</span>`;
  }
});
</script>
</body>
</html>
